<style is:global>
  .rev-hero { padding: var(--sp-16, 64px) 0 var(--sp-8, 36px); background: var(--surface-page, #fff); }
  .rev-hero .s-lead { max-width: 62ch; }

  .rev-section { padding: 0 0 var(--section-py-base, 96px); background: var(--surface-page, #fff); }
  .rev-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--sp-5, 24px);
  }
  .review-doc {
    display: flex; flex-direction: column;
    background: var(--surface-subtle, #f5f7f8);
    border: 1px solid var(--border-subtle, #e6eaee);
    border-radius: 14px;
    overflow: hidden;
    padding: 0;
    text-align: left;
    cursor: zoom-in;
    font: inherit; color: inherit;
    transition: border-color .18s, transform .18s, box-shadow .18s;
  }
  .review-doc:hover {
    border-color: var(--teal-600, #1F5E78);
    transform: translateY(-3px);
    box-shadow: 0 14px 32px -16px rgba(16,31,38,.4);
  }
  .review-doc__thumb {
    position: relative;
    background: #fff;
    border-bottom: 1px solid var(--border-subtle, #e6eaee);
    aspect-ratio: 3 / 4;
    overflow: hidden;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .review-doc__thumb img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
    display: block;
  }
  .review-doc__zoom {
    position: absolute; top: 10px; right: 10px;
    width: 34px; height: 34px; border-radius: 8px;
    background: rgba(16,31,38,.72); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    backdrop-filter: blur(3px);
  }
  .review-doc__zoom svg { width: 18px; height: 18px; }
  .review-doc__caption { padding: var(--sp-4, 18px) var(--sp-5, 20px) var(--sp-5, 22px); }
  .review-doc__from {
    font-family: var(--font-display); font-weight: 600; font-size: 16px;
    color: var(--text-primary, #101F26); line-height: 1.3; margin: 0 0 4px;
  }
  .review-doc__meta { font-size: var(--fs-small, 14px); color: var(--text-secondary, #5b6b73); line-height: 1.4; }

  /* ── Лайтбокс (открытие на весь экран) ── */
  .rev-lb {
    position: fixed; inset: 0; z-index: 4000;
    background: rgba(10,16,20,.92);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .rev-lb[hidden] { display: none; }
  .rev-lb__img {
    max-width: min(96vw, 900px); max-height: 92vh;
    width: auto; height: auto;
    border-radius: 6px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.7);
    background: #fff;
  }
  .rev-lb__cap {
    position: absolute; left: 0; right: 0; bottom: 18px;
    text-align: center; color: rgba(255,255,255,.9);
    font-family: var(--font-display); font-size: 14px; padding: 0 24px;
  }
  .rev-lb__close {
    position: absolute; top: 16px; right: 18px;
    width: 44px; height: 44px; border: 0; border-radius: 50%;
    background: rgba(255,255,255,.14); color: #fff; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .18s;
  }
  .rev-lb__close:hover { background: rgba(255,255,255,.28); }
  .rev-lb__close svg { width: 22px; height: 22px; }

  @media (max-width: 1024px) { .rev-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px)  { .rev-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .review-doc__caption { padding: 12px 12px 14px; }
    .review-doc__from { font-size: 14px; }
    .review-doc__meta { font-size: 12px; }
  }
</style>

<div class="rev-lb" id="rev-lb" hidden role="dialog" aria-modal="true" aria-label="Просмотр письма">
  <button type="button" class="rev-lb__close" id="rev-lb-close" aria-label="Закрыть">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <img class="rev-lb__img" id="rev-lb-img" src="" alt="">
  <div class="rev-lb__cap" id="rev-lb-cap"></div>
</div>

<script>
(function () {
  var lb = document.getElementById('rev-lb');
  if (!lb) return;
  var img = document.getElementById('rev-lb-img');
  var cap = document.getElementById('rev-lb-cap');
  var closeBtn = document.getElementById('rev-lb-close');

  function open(src, alt, caption) {
    img.src = src; img.alt = alt || '';
    cap.textContent = caption || '';
    lb.hidden = false;
    document.documentElement.style.overflow = 'hidden';
  }
  function close() {
    lb.hidden = true;
    img.src = '';
    document.documentElement.style.overflow = '';
  }

  document.querySelectorAll('.review-doc[data-full]').forEach(function (el) {
    el.addEventListener('click', function () {
      var im = el.querySelector('img');
      open(el.getAttribute('data-full'), im ? im.alt : '', el.getAttribute('data-caption'));
    });
  });
  closeBtn.addEventListener('click', close);
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !lb.hidden) close(); });
})();
</script>
