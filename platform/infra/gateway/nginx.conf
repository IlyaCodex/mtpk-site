# ============================================================================
# Шлюз платформы uralinduktor.ru (контейнер gateway).
# Стоит за системным nginx сервера, который держит TLS и домен:
#   location / { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host;
#                proxy_set_header X-Real-IP $remote_addr;
#                proxy_set_header X-Forwarded-Proto $scheme; }
# Маршруты: картинки/файлы → media (с кешем), формы → leads, поиск → search,
# данные склада/сравнения, вынесенные стили и скрипты блоков → content,
# /admin → админка (вход по секретной ссылке), всё остальное → web.
# ============================================================================
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  # заявка с вложением «Прикрепить КП» — до 10 МБ
  client_max_body_size 12m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript text/javascript application/json application/xml image/svg+xml text/plain;

  log_format json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method","u":"$request_uri",'
                              '"s":$status,"b":$body_bytes_sent,"rt":$request_time,"up":"$upstream_addr","c":"$upstream_cache_status"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  # Реальный IP посетителя: доверяем X-Real-IP только от системного nginx (сети Docker/localhost).
  # Нужен антиспаму заявок (лимит 5 заявок в минуту на IP).
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Real-IP;

  # Схема исходного запроса (https) — для абсолютных редиректов Next.js
  map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  # Кеш медиа: ключ учитывает формат, который понимает браузер (медиасервис
  # выбирает по Accept: копии ?w=… — AVIF/WebP, оригиналу — .webp-сосед)
  map $http_accept $img_format {
    default "";
    "~*image/avif" "avif";
    "~*image/webp" "webp";
  }
  proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:20m max_size=2g inactive=30d use_temp_path=off;

  # Частота запросов с одного IP: поиск, формы заявок, вход в админку — от перебора и
  # нагрузки (у заявок и входа есть и свои лимиты в сервисах; это первый рубеж)
  limit_req_zone $binary_remote_addr zone=search:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=forms:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_status 429;
  proxy_temp_path /var/cache/nginx/tmp;
  client_body_temp_path /var/cache/nginx/body;

  upstream web     { server web:3000;     keepalive 16; }
  upstream media   { server media:4104;   keepalive 16; }
  upstream content { server content:4101; keepalive 8; }
  upstream leads   { server leads:4102; }
  upstream search  { server search:4103; }
  upstream mailing { server mailing:4105; }
  upstream admin   { server admin:3000;   keepalive 8; }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $fwd_proto;

    include /etc/nginx/security-headers.conf;

    location = /__gateway_health {
      access_log off;
      return 200 "ok";
    }

    # Картинки, документы, OG-изображения
    location ~ ^/(img|files|docs|og)/ {
      proxy_pass http://media;
      proxy_cache media;
      proxy_cache_key "$uri$is_args$args|$img_format";
      proxy_cache_valid 200 206 304 7d;
      proxy_cache_valid 404 1m;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      # срок кеша — из ответа медиасервиса (5 мин): дальше шлюз перепроверяет файл фоном (ETag → 304),
      # посетитель сразу получает сохранённую копию; файл, заменённый в медиатеке, обновляется сам
      proxy_cache_revalidate on;
      proxy_cache_background_update on;
      add_header X-Cache-Status $upstream_cache_status always;
      include /etc/nginx/security-headers.conf;
    }

    # Ассеты «Практикума» (сами статьи отдаёт сайт)
    location ~ ^/praktikum/.+\.(css|js|webp|png|jpe?g|svg|gif|avif|woff2?|pdf)$ {
      proxy_pass http://media;
      proxy_cache media;
      proxy_cache_key "$uri$is_args$args|$img_format";
      proxy_cache_valid 200 304 7d;
      proxy_cache_valid 404 1m;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      # срок кеша — из ответа медиасервиса (5 мин): дальше шлюз перепроверяет файл фоном (ETag → 304),
      # посетитель сразу получает сохранённую копию; файл, заменённый в медиатеке, обновляется сам
      proxy_cache_revalidate on;
      proxy_cache_background_update on;
      add_header X-Cache-Status $upstream_cache_status always;
      include /etc/nginx/security-headers.conf;
    }

    # Формы заявок: старый адрес и новый
    location = /api/send.php { limit_req zone=forms burst=5 nodelay; proxy_pass http://leads; proxy_read_timeout 30s; }
    location = /api/leads    { limit_req zone=forms burst=5 nodelay; proxy_pass http://leads; proxy_read_timeout 30s; }

    # Поиск по сайту
    location = /api/search { limit_req zone=search burst=20 nodelay; proxy_pass http://search; }

    # Ссылки из писем рассылок: переходы (редирект с UTM), открытия, отписка
    location ^~ /r/ { proxy_pass http://mailing; }

    # Сигнал ревалидации — только из внутренней сети (контент-сервис ходит напрямую в web)
    location = /api/revalidate { return 404; }

    # Данные «Наличия» и «Сравнения» (адреса старой статики)
    location ~ ^/data/(stock\.json|compare-index\.json|compare-sections\.json)$ {
      proxy_pass http://content/v1/data/$1;
    }

    # Вынесенные крупные стили страниц (имя = хеш содержимого)
    location ^~ /css/inline-extracted/ {
      rewrite ^/css/inline-extracted/(.*)$ /v1/styles/$1 break;
      proxy_pass http://content;
    }

    # Скрипты блоков «Скрипт» (имя = хеш исходника)
    location ^~ /js/page/ {
      rewrite ^/js/page/(.*)$ /v1/scripts/$1 break;
      proxy_pass http://content;
    }

    # Админка: uralinduktor.ru/admin. Вход — только по секретной ссылке
    # /admin/login?token=… (без неё — 404). Служебные /admin/v1 сервисов наружу
    # не открыты: админка ходит к ним по внутренней сети Docker.
    location = /admin { proxy_pass http://admin; proxy_set_header X-Forwarded-Host $host; }
    # превью медиатеки админки (/admin/media-files/img/… — те же файлы, что /img/…): прямо из медиасервиса
    # и общим кешем. В Next-админке это rewrite, но адрес медиасервиса в нём фиксируется при сборке образа.
    location ^~ /admin/media-files/ {
      rewrite ^/admin/media-files(/.*)$ $1 break;
      proxy_pass http://media;
      proxy_cache media;
      proxy_cache_key "$uri$is_args$args|$img_format";
      proxy_cache_valid 200 206 304 7d;
      proxy_cache_valid 404 1m;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_revalidate on;
      proxy_cache_background_update on;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header X-Cache-Status $upstream_cache_status always;
      include /etc/nginx/security-headers.conf;
    }
    # вход (пароль, код 2FA): не больше 10 попыток в минуту с IP
    location = /admin/api/v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_set_header X-Forwarded-Host $host;
      add_header X-Robots-Tag "noindex, nofollow" always;
      include /etc/nginx/security-headers.conf;
      proxy_pass http://admin;
    }
    location ^~ /admin/ {
      # загрузка файлов в медиатеку
      client_max_body_size 50m;
      proxy_set_header X-Forwarded-Host $host;
      proxy_read_timeout 120s;
      add_header X-Robots-Tag "noindex, nofollow" always;
      include /etc/nginx/security-headers.conf;
      proxy_pass http://admin;
    }

    # Всё остальное — сайт (страницы, редиректы, sitemap, статика дизайна)
    location / {
      proxy_pass http://web;
      proxy_read_timeout 60s;
    }
  }
}
