# Заголовки безопасности — перенос server/snippets/security-headers.conf.
# В nginx add_header не наследуется в location со своим add_header, поэтому
# файл подключается и в server, и в таких location.
#
# HSTS без includeSubDomains/preload: mail.uralinduktor.ru — Яндекс.Почта
# (решение Евгения 2026-06-18). Если системный nginx сервера уже ставит эти
# заголовки — убрать их там, иначе будут дубли.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options    "nosniff" always;
# X-Frame-Options не ставим: он ломает Вебвизор Метрики; кликджекинг закрыт frame-ancestors.
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

