<?xml version="1.0" encoding="UTF-8"?>
<!--
  МТПК / Уралиндуктор — graphic mark, hand-crafted SVG.
  Координаты построены по пиксельному анализу оригинала logo-2023v3.png:
    Original (147×35), графический знак занимает cols 7..45, rows 2..30.
    Левая полоса (зелёная) — cols 7-8
    Зелёный треугольник — vertices (14,2), (37,2), (14,21)
    Белый диагональный канал между треугольниками
    Teal треугольник — vertices (43,10), (43,30), (18,30)
    Правая полоса (teal) — cols 44-45
  Здесь масштабировано в viewBox 100×80 для удобства вёрстки.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 80"
     fill="none"
     aria-label="МТПК Уралиндуктор">
  <!-- Левая зелёная вертикальная полоса -->
  <rect x="6" y="5" width="5" height="70" fill="#4FAB3A"/>

  <!-- Зелёный треугольник: top-left corner sharp 90°, top-right and bottom-left acute -->
  <polygon points="20,5 78,5 20,57" fill="#4FAB3A"/>

  <!-- Teal треугольник: bottom-right corner sharp 90°, top-right and bottom-left acute,
       зеркально зелёному, разделён диагональным белым каналом -->
  <polygon points="89,23 89,75 32,75" fill="#1F5E78"/>

  <!-- Правая teal вертикальная полоса -->
  <rect x="93" y="5" width="5" height="70" fill="#1F5E78"/>
</svg>
